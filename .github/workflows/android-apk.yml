name: Android APK

on:
  push:
    branches: [ccr-14329060-d9rc7i, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk amol-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: amol-tracker-apk
          path: amol-tracker.apk

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest amol-tracker.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Android APK (latest)" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}. Download amol-tracker.apk on your phone and open it to install."
